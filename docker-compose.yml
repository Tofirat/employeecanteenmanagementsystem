version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: canteen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: canteen_db
      POSTGRES_USER: canteen_user
      POSTGRES_PASSWORD: canteen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
